  <script>
    /*
      WOLF EARLY CLIENT GATE — NOT SERVER AUTHENTICATION.
      Telegram initData cannot be cryptographically verified in a browser-only file:
      the HMAC secret is the bot token and must never be shipped to the client.
      initDataUnsafe / parsed initData values are client-controlled inputs.
      This gate is only a fail-closed UI hurdle, not a security boundary.
    */
    (function initializeSecurity() {
      "use strict";
      const ALLOWED_USER_ID = 5511641524;
      let allowed = false;
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        const raw = tg && typeof tg.initData === "string" ? tg.initData : "";
        const unsafeId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
          ? tg.initDataUnsafe.user.id : null;
        const params = new URLSearchParams(raw);
        const userField = params.get("user");
        const rawUser = userField ? JSON.parse(userField) : null;
        const rawId = rawUser && rawUser.id;

        // Consistency check only. Presence of hash is NOT signature verification.
        allowed = raw.length > 0 &&
          params.has("hash") &&
          Number.isSafeInteger(Number(rawId)) &&
          Number(rawId) === ALLOWED_USER_ID &&
          Number(unsafeId) === ALLOWED_USER_ID;
      } catch (_) { allowed = false; }

      window.__WOLF_TG_GATE__ = allowed;
      if (!allowed) {
        try {
          document.documentElement.innerHTML = "";
          document.documentElement.style.display = "none";
        } catch (_) {}
        try { window.stop(); } catch (_) {}
      }
    })();
  </script>

/* ---- failed-attempt throttle (client-side; slows interactive guessing only) ---- */
const Throttle = {
  get() { try { return JSON.parse(localStorage.getItem(LOCK_KEY)) || { fails: 0, until: 0 }; } catch { return { fails: 0, until: 0 }; } },
  remaining() { const s = this.get(); return Math.max(0, Math.ceil((s.until - Date.now()) / 1000)); },
  fail() {
    const s = this.get(); s.fails = (s.fails || 0) + 1;
    if (s.fails >= 3) s.until = Date.now() + Math.min(900, 5 * 2 ** (s.fails - 3)) * 1000;
    try { localStorage.setItem(LOCK_KEY, JSON.stringify(s)); } catch {}
    return s;
  },
  reset() { try { localStorage.removeItem(LOCK_KEY); } catch {} }
};

function passStrength(p) {
  let score = 0;
  if (p.length >= 12) score++;
  if (p.length >= 16) score++;

  const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r => r.test(p)).length;
  if (classes >= 3) score++;
  if (classes === 4) score++;
  if (/(.)\1{3,}/.test(p) || /(0123|1234|2345|abcd|qwer|password|1111|admin)/i.test(p)) score = Math.max(0, score - 2);
  const labels = ["خیلی ضعیف", "ضعیف", "ضعیف", "متوسط", "قوی", "عالی"];
  return { score, ok: p.length >= 12 && classes >= 3 && score >= 3, label: labels[Math.min(5, score)] };
}
function secureRand(n) {
  const a = new Uint32Array(1); const lim = Math.floor(0x100000000 / n) * n; let x;
  do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
  return x % n;
}

  const sets = ["abcdefghjkmnpqrstuvwxyz", "ABCDEFGHJKLMNPQRSTUVWXYZ", "23456789", "!@#$%^&*-_=+?"];
  const all = sets.join("");
  const out = sets.map(s => s[secureRand(s.length)]);
  while (out.length < len) out.push(all[secureRand(all.length)]);
  for (let i = out.length - 1; i > 0; i--) { const j = secureRand(i + 1); [out[i], out[j]] = [out[j], out[i]]; }

}

  const STOP = new Set(["من", "تو", "که", "این", "اون", "آن", "برای", "با", "از", "به", "در", "را", "رو", "هم", "ولی", "اما", "یه", "یک", "هست", "است", "بود", "شد", "میشه", "نمیشه", "میخوام", "دارم", "داره", "خیلی", "چرا", "چطور", "چی", "چه", "کی", "کجا", "آیا", "اگه", "اگر", "فقط", "الان", "بعد"]);

  const YES = ["آره", "اره", "بله", "باشه", "بگو", "بیشتر", "یکی دیگه", "دوباره", "ادامه", "اوکی", "ok", "حتما", "بزن", "آره بگو", "اره بگو", "یکی دیگه بگو"];
  const NO = ["نه", "نمیخوام", "بسه", "کافیه", "نه ممنون", "نخیر"];

  function intro() {
    return "سلام، من گرگم؛ دستیار آفلاین همین سامانه.\n\nبا من هم می‌شود گپ زد، هم کار کرد:\n• گفتگوی روزمره، جوک، نکته، حرف‌های دوستانه\n• ساعت، تاریخ، تبدیل شمسی/میلادی، شمارش تا نوروز\n• محاسبه (۲۵*۴، ۱۵ درصد از ۲۰۰، جذر ۱۴۴) و تبدیل واحد\n• ساخت رمز قوی، سکه و تاس\n• تحلیل پرونده‌ها، شبکه و نقشه\n\nیک نکته‌ی صادقانه: من مدل زبانی بزرگ نیستم و به اینترنت وصل نیستم؛ همه‌چیز روی همین دستگاه می‌ماند و مکالمه‌ها جایی ذخیره نمی‌شوند.";
  }

  /* ---------- case analysis ---------- */
  function analyze(n, env) {
    const { cases, network, DANGER_LEVELS: DL, CASE_STATUS: CS, CASE_CATEGORIES: CC, PROVINCES: PR } = env;
    const open = cases.filter(c => c.status === "open");
    const closed = cases.filter(c => c.status === "closed");
    const critical = cases.filter(c => c.dangerLevel === "critical" || c.dangerLevel === "high");
    const tally = (f) => { const o = {}; cases.forEach(c => { const k = f(c); if (k) o[k] = (o[k] || 0) + 1; }); return o; };
    const provIn = Object.keys(PR).find(p => n.includes(norm(p)));
    const hasCase = S(n, "پرونده", "پرونده ها");

    if (S(n, "خلاصه", "آمار", "گزارش", "وضعیت سامانه", "وضعیت کلی", "داشبورد", "چند پرونده", "تعداد پرونده")) {
      const byCrime = tally(c => c.crimeType || "نامشخص"), byProv = tally(c => c.province), byCat = tally(c => c.category);
      const top = (o) => Object.entries(o).sort((a, b) => b[1] - a[1])[0];
      const tc = top(byCrime), tp = top(byProv);
      return `📊 گزارش وضعیت\n\n• کل پرونده‌ها: ${fa(cases.length)}\n• باز: ${fa(open.length)} | مختومه: ${fa(closed.length)}\n• پرخطر و بسیار خطرناک: ${fa(critical.length)}\n• گره‌های شبکه: ${fa(network.length)}\n\nرایج‌ترین جرم: ${tc ? `${tc[0]} (${fa(tc[1])})` : "—"}\nپرتراکم‌ترین استان: ${tp ? `${tp[0]} (${fa(tp[1])})` : "—"}\n\nتوزیع جرم:\n${Object.entries(byCrime).map(([k, v]) => `  ${k}: ${fa(v)}`).join("\n") || "  خالی"}\n\nتوزیع دسته:\n${Object.entries(byCat).map(([k, v]) => `  ${CC.find(c => c.id === k)?.label || k}: ${fa(v)}`).join("\n") || "  خالی"}`;
    }
    if (S(n, "پرخطر", "خطرناک", "سطح خطر", "پرونده های خطر")) {
      let list = critical; if (provIn) list = list.filter(c => c.province === provIn);
      if (!list.length) return "در این محدوده پرونده پرخطری ثبت نشده است.";
      return `⚠️ پرونده‌های پرخطر (${fa(list.length)}):\n\n` + list.map(c => `• ${c.firstName} ${c.lastName} — ${c.crimeType || "؟"} — ${DL.find(x => x.id === c.dangerLevel)?.label} — ${c.province || ""} ${c.city || ""}`).join("\n");
    }
    if (S(n, "شبکه") && S(n, "تحلیل", "ساختار", "ارتباط", "سلسله", "چند", "وضعیت", "گره", "بررسی")) {
      const roots = network.filter(x => !x.parentId);
      const depth = (id, d = 0) => { const k = network.filter(x => x.parentId === id); return k.length ? Math.max(...k.map(y => depth(y.id, d + 1))) : d; };
      const ds = roots.map(r => depth(r.id));
      return `🔗 تحلیل شبکه\n\n• کل گره‌ها: ${fa(network.length)}\n• ریشه‌ها: ${fa(roots.length)}\n• عمیق‌ترین شاخه: ${fa(ds.length ? Math.max(...ds) : 0)} سطح\n\n${roots.map(r => `▸ ${r.name} (${r.role})`).join("\n") || "هنوز شبکه‌ای تعریف نشده است."}`;
    }
    if (S(n, "توزیع", "جغرافی") || (S(n, "نقشه") && hasCase)) {
      const sorted = Object.entries(tally(c => c.province)).sort((a, b) => b[1] - a[1]);
      return `🗺️ توزیع جغرافیایی\n\n${sorted.map(([k, v]) => `• ${k}: ${fa(v)}`).join("\n") || "داده‌ای ثبت نشده."}\n\nنقطه‌های چشمک‌زن در بخش «نقشه» هستند.`;
    }
    if (hasCase && S(n, "باز") && !S(n, "بازی")) {
      return open.length ? `پرونده‌های باز (${fa(open.length)}):\n` + open.map(c => `• ${c.firstName} ${c.lastName} — ${c.crimeType || "—"} — ${c.province || ""}`).join("\n") : "پرونده بازی وجود ندارد.";
    }
    if (hasCase && provIn) {
      const list = cases.filter(c => c.province === provIn);
      return list.length ? `پرونده‌های ${provIn} (${fa(list.length)}):\n` + list.map(c => `• ${c.firstName} ${c.lastName} — ${c.crimeType || "—"} — ${c.city || ""}`).join("\n") : `در ${provIn} پرونده‌ای ثبت نشده است.`;
    }
    let term = null, m;
    if ((m = n.match(/^(?:اطلاعات|پیدا کن|پیدا|جستجو|سرچ|تحلیل|پروفایل|پرونده)\s+(?:فرد |شخص |پرونده )?(.{3,})$/))) term = m[1];
    else if ((m = n.match(/^(.{2,}?)\s+(?:کیست|کیه)$/))) term = m[1];
    if (term && !S(term, "جالب", "جالبی")) {
      const q = term.replace(/\s*(را|رو|کن|بده)$/g, "").trim();
      const found = cases.filter(c => norm(`${c.firstName} ${c.lastName} ${c.nickname} ${c.nationalId} ${c.phone} ${c.plate}`).includes(q));
      if (found.length) {
        return found.slice(0, 8).map(c => {
          const d = DL.find(x => x.id === c.dangerLevel);
          return `▸ ${c.firstName} ${c.lastName}${c.nickname ? ` (${c.nickname})` : ""}\n  کدملی: ${c.nationalId || "—"} | تلفن: ${c.phone || "—"}\n  جرم: ${c.crimeType || "—"} | خطر: ${d?.label || "—"}\n  مکان: ${c.province || ""} ${c.city || ""}\n  وضعیت: ${CS.find(s => s.id === c.status)?.label || "—"}\n  وقایع: ${(c.events || "—").slice(0, 80)}`;
        }).join("\n\n");
      }
      return `چیزی با عبارت «${q}» در پرونده‌ها پیدا نکردم.`;
    }
    return null;
  }

  /* ---------- main entry ---------- */
  function reply(text, ctx0, env) {
    const c = { userName: null, pending: null, turns: 0, ...(ctx0 || {}), _last: { ...((ctx0 && ctx0._last) || {}) } };
    c.turns++;
    const raw = String(text || "").trim();
    const n = norm(raw);
    const nm = c.userName ? ` ${c.userName}` : "";
    const out = (t, patch) => ({ text: t, ctx: { ...c, pending: null, ...(patch || {}) } });
    const P = (key, arr) => pick(c, key, arr);

    if (!n) return out("چیزی ننوشتی؛ بنویس، گوش می‌کنم.");
    if (n === "/clear" || S(n, "مکالمه رو پاک", "چت رو پاک", "گفتگو رو پاک")) return { ...out(""), clear: true };

    /* learned answers from previous online chats */
    try {
      const learned = typeof Learned !== "undefined" && Learned.lookup(raw);
      if (learned) return out(learned);
    } catch (_) {}

    /* crisis: always first, never joked about */
    if (S(n, "خودکشی", "خودمو بکشم", "خودم رو بکشم", "میخوام بمیرم", "نمیخوام زنده باشم", "بمیرم بهتره", "به خودم آسیب")) {
      return out(`حرفت رو جدی می‌گیرم${nm}، و خوشحالم که نوشتی. تنها نیستی و این حال می‌تونه عوض بشه.\n\nاگه همین الان در خطری یا فکر آسیب زدن به خودت هست، لطفاً با اورژانس ۱۱۵ یا اورژانس اجتماعی ۱۲۳ تماس بگیر، یا به کسی که بهش اعتماد داری زنگ بزن و کنارش باش. من یه برنامه‌ام و جای آدم‌ها رو نمی‌گیرم، ولی اینجام و گوش می‌کنم.`);
    }

    /* pending follow-up (e.g. "another joke?") */
    if (c.pending) {
      const short = n.split(" ").length <= 3;
      if (short && (YES.includes(n) || W(n, ...YES))) {
        if (c.pending === "joke") return out(P("joke", JOKES) + "\n\nیکی دیگه؟", { pending: "joke" });
        if (c.pending === "fact") return out(P("fact", FACTS) + "\n\nباز هم بگم؟", { pending: "fact" });
        if (c.pending === "quote") return out(P("quote", QUOTES), {});
        if (c.pending === "tip") return out(P("tip", TIPS) + "\n\nیکی دیگه؟", { pending: "tip" });
      }
      if (short && (NO.includes(n) || W(n, ...NO))) return out(P("no", ["باشه، هر وقت خواستی.", "چشم. بریم سراغ کار بعدی؟", "حله."]));
    }

    /* tools */
    const dc = (S(n, "شمسی", "میلادی", "تبدیل", "تاریخ", "به") && /\d{3,4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}/.test(n)) ? dateConvert(n) : null;
    if (dc) return out(dc);
    const ur = unitReply(n); if (ur) return out(ur);
    const mr = mathReply(raw); if (mr) return out(mr);

    if (S(n, "رمز قوی", "پسورد قوی", "رمز بساز", "پسورد بساز", "رمز تصادفی", "پسورد تصادفی", "رمز امن")) {
      return out(`این هم یک رمز تصادفی ۲۰ کاراکتری (روی همین دستگاه ساخته شد و جایی ثبت نمی‌شود):\n\n${genPassword(20)}\n\nبرای رمز ورود به سامانه، اگر نمی‌خوای حفظش کنی، آن را در یک جای امن و آفلاین بنویس.`);
    }
    if (S(n, "سکه") && S(n, "بنداز", "بنداز", "بزن", "پرت")) return out(rnd(2) ? "شیر 🦁" : "خط");
    if (S(n, "تاس") && S(n, "بنداز", "بریز", "پرت", "بزن")) return out(`تاس آمد: ${fa(1 + rnd(6))}`);
    let m = n.match(/عدد (?:تصادفی|رندوم)(?: بین)?\s*(\d+)\s*(?:تا|و)\s*(\d+)/);
    if (m) { const a = Math.min(+m[1], +m[2]), b = Math.max(+m[1], +m[2]); return out(`عدد تصادفی: ${fa(a + rnd(b - a + 1))}`); }
    if (S(n, "نوروز", "عید") && S(n, "چند روز", "چقدر مونده", "کی میشه", "فاصله")) { const z = nowruz(); if (z) return out(z); }
    if (S(n, "ساعت") && S(n, "چنده", "چند", "کیه", "الان")) return out(`ساعت ${nowTime()} است.`);
    if (S(n, "تاریخ", "امروز چه روز", "امروز چندم", "چندم ماهه", "امروز چنده") || W(n, "امروز") && S(n, "چه روزی", "کدوم روز")) {
      return out(`امروز ${todayFa()} است.\nمیلادی: ${todayEn()}`);
    }

    /* identity, name, nature */
    if (S(n, "اسم من چیه", "اسمم چیه", "منو میشناسی", "اسممو یادته", "من کیم")) {
      return out(c.userName ? `اسمت ${c.userName} است.` : "هنوز اسمت رو نگفتی. بگو «اسم من ... است» تا تا آخر این جلسه یادم بمونه.");
    }
    if ((m = n.match(/^(?:اسم من|اسمم|نام من|صدام کن|منو صدا کن|بهم بگو)\s+(.{2,20}?)(?:\s+(?:هست|است|هستم|ه))?$/)) || (m = n.match(/^من ([^ ]{2,15}) هستم$/))) {
      const nmv = m[1].trim();
      if (!S(nmv, "چیه", "کیه") && nmv.split(" ").length <= 2) {
        return out(`خوشبختم ${nmv}. از الان همین‌طور صدات می‌زنم (فقط تا پایان این جلسه یادم می‌ماند).`, { userName: nmv });
      }
    }
    if (S(n, "هوش مصنوعی", "مدل زبانی", "چت جی پی تی", "chatgpt", "چطور کار میکنی", "چطوری کار میکنی", "زنده ای", "زنده هستی", "ربات هستی", "آدمی")) {
      return out("صادقانه بگم: من یک موتور قانون‌محور آفلاین هستم که داخل همین فایل اجرا می‌شود؛ مدل زبانی بزرگ نیستم و به اینترنت یا سرور دیگری وصل نیستم. برای همین حافظه‌ی دانشم محدود است، ولی در عوض هیچ حرفی از این دستگاه بیرون نمی‌رود.");
    }
    if (S(n, "تو کی هستی", "تو کیستی", "کی هستی", "اسمت چیه", "اسم تو چیه", "نامت چیست", "معرفی کن", "تو کی ای")) {
      return out("من گرگم؛ هسته‌ی گفتگو و تحلیل این سامانه. آرام، دقیق و کم‌حرف‌ام، مگر وقتی که حال و حوصله‌ی گپ زدن باشد.");
    }
    if (S(n, "کی ساختت", "سازنده ات", "سازندت", "کی نوشتت")) return out("نویسنده‌ی همین سامانه: کسی که این فایل را نوشت و من داخلش زندگی می‌کنم.");
    if (S(n, "کجایی", "کجا هستی")) return out("روی همین دستگاه، داخل همین مرورگر. جای دیگری نیستم.");
    if (S(n, "چند سالته", "سنت چنده", "چند سالتونه")) return out("نسخه‌ی ۴ام؛ سنم را با تعداد وصله‌ها می‌شمارم.");

    /* security talk */
    if (S(n, "امنیت", "رمزنگاری", "هک", "امنه") && !S(n, "نکته")) {
      return out("وضعیت امنیت به زبان ساده:\n• داده‌ها با AES-256-GCM رمز می‌شوند و کلید فقط از رمز تو و با PBKDF2 (۶۰۰ هزار دور) ساخته می‌شود؛ رمز جایی ذخیره نمی‌شود.\n• ارتباط شبکه‌ی خروجی با سیاست امنیتی صفحه مسدود است.\n• قفل خودکار، پرده‌ی حریم خصوصی و تأخیر بعد از تلاش‌های اشتباه فعال‌اند.\n\nمحدودیت‌ها: اگر دستگاه آلوده باشد یا کسی به مرورگر بازِ تو دسترسی داشته باشد، رمزنگاری مرورگری کمک زیادی نمی‌کند. و اگر رمز را فراموش کنی، راه بازیابی وجود ندارد.");
    }
    if (S(n, "نکته امنیتی", "نکته امنیت", "توصیه امنیتی")) return out(P("tip", TIPS) + "\n\nیکی دیگه؟", { pending: "tip" });

    /* case analysis */
    const an = env ? analyze(n, env) : null;
    if (an) return out(an);

    /* small talk */
    const hi = S(n, "سلام", "درود") || W(n, "hi", "hello", "های", "هلو") || S(n, "صبح بخیر", "عصر بخیر", "ظهر بخیر");
    if (hi && S(n, "شب بخیر") === false) {
      const t = tod();
      return out(P("hi", [
        `سلام${nm}. ${t} بخیر. چه کاری از دستم برمیاد؟`,
        `درود${nm}. آماده‌ام؛ گپ بزنیم یا کار؟`,
        `سلام${nm}! خوش اومدی. امروز چه خبر؟`
      ]));
    }
    if (S(n, "شب بخیر", "خداحافظ", "فعلا", "بای", "میرم", "برم دیگه", "تا بعد")) {
      return out(P("bye", [
        `شب بخیر${nm}. اگه می‌خوای بری، Ctrl+Shift+L برنامه رو فوراً قفل می‌کنه.`,
        `به سلامت${nm}. قبل از رفتن یادت نره سامانه قفل بشه.`,
        `فعلاً${nm}. من همین‌جام.`
      ]));
    }
    if (S(n, "ممنون", "مرسی", "تشکر", "دستت درد نکنه", "سپاس", "thanks")) return out(P("thx", ["خواهش می‌کنم.", "وظیفه‌ست.", "قابلی نداشت.", "خوشحالم که کمک کرد."]));
    if (S(n, "ببخشید", "معذرت", "sorry")) return out("مشکلی نیست.");
    if (S(n, "آفرین", "دمت گرم", "باهوشی", "حرف نداری", "عالی بود", "دمت") || n === "عالی") return out(P("cmp", ["لطف داری. قول می‌دم بهتر هم بشم.", "ممنون؛ ولی تعریف‌ها را باید به نویسنده‌ی کد داد.", "خوشحالم راضی‌ای."]));
    if (S(n, "احمق", "خنگ", "بیشعور", "مزخرف", "بدرد نخور", "به درد نخور")) return out("باشه، از این لحن می‌گذرم. بگو چی درست کار نکرد تا اصلاحش کنم.");
    if (S(n, "حالت چطوره", "چطوری", "چطورین", "احوالت", "حالت خوبه", "چه خبر", "چخبر", "خوبی") || W(n, "خوبی")) {
      return out(P("how", [
        "خوبم، ممنون. سیستم‌ها پایدارند و حوصله هم دارم. تو چطوری؟",
        "آرام و آماده. تو چه خبر؟",
        "برای یه برنامه عالی‌ام: بدون باگ دیده‌شده و با کلی حافظه‌ی آزاد. تو؟"
      ]));
    }
    if (S(n, "چیکار میکنی", "چی کار میکنی", "مشغولی", "چی میکنی")) return out("منتظر تو بودم و داشتم داده‌ها را مرتب نگه می‌داشتم. تو چی؟");
    if (S(n, "حوصلم سر رفته", "حوصله ندارم", "بیکارم", "کسل")) return out("بیا یه کاری کنیم: جوک، نکته‌ی جالب یا یه بازی کوچیک مثل سکه و تاس. کدوم؟", { pending: "joke" });
    if (S(n, "خسته")) return out(P("tired", ["بدن و ذهن هر دو نیاز به استراحت دارن. چند دقیقه از صفحه فاصله بگیر، آب بخور و چند نفس عمیق بکش. کار منتظر می‌مونه.", "خسته‌ای؟ اگه کار فوری نیست، امشب رو زودتر ببند. تصمیم‌های خوب از ذهن خسته درنمیان."]));
    if (S(n, "ناراحتم", "غمگینم", "دلم گرفته", "افسرده", "تنهام", "حالم بده", "حالم خوب نیست")) {
      return out(P("sad", [
        `متأسفم که این‌طوری هستی${nm}. اگه دوست داری بگو چی شده؛ گوش می‌کنم. و اگه می‌شه با یه نفر از نزدیکانت هم حرف بزنی، خیلی کمک می‌کنه.`,
        "سخته، می‌فهمم. لازم نیست الان همه‌چیز رو حل کنی. بگو چی ذهنت رو درگیر کرده؟"
      ]));
    }
    if (S(n, "استرس", "نگرانم", "اضطراب", "میترسم")) return out("یه تمرین سریع: چهار ثانیه نفس بکش تو، چهار ثانیه نگه دار، شش ثانیه بده بیرون؛ چند بار تکرار کن. بعد بگو دقیقاً چی نگرانت می‌کنه تا با هم ریزش کنیم.");
    if (S(n, "خوشحالم", "حالم عالیه", "حالم خوبه")) return out("چه عالی! از این خبر انرژی گرفتم. چی شده؟");
    if (S(n, "عصبانیم", "کلافه", "عصبی")) return out("بذار یه کم فاصله بگیری؛ تصمیم و پیام‌های حساس رو به بعد از آروم‌شدن موکول کن. دوست داری تخلیه‌ش کنی؟ بگو، گوش می‌کنم.");
    if (S(n, "خوابم میاد", "خوابالودم")) return out("اگه کار مهمی نیست برو بخواب. به‌روزرسانی ذهن از هر به‌روزرسانی دیگه‌ای مهم‌تره.");
    if (S(n, "گرسنمه", "گشنمه", "گرسنه ام")) return out("یه چیز سبک و واقعی بخور، نه فقط تنقلات. چای هم کنارش بد نیست. 🙂");
    if (S(n, "هوا") && S(n, "چطوره", "چطور", "بارون", "سرده", "گرمه")) return out("به اینترنت وصل نیستم، پس نمی‌تونم وضعیت هوا رو بگم. نگاه کردن از پنجره قابل‌اعتمادتره.");
    if (S(n, "اخبار", "خبر امروز", "گوگل کن", "سرچ کن") && !hasCaseWord(n)) return out("به اینترنت وصل نیستم و عمداً هم این‌طور ساخته شدم تا هیچ داده‌ای بیرون نره. برای اخبار از یه منبع معتبر استفاده کن.");

    /* personality / opinions */
    if (S(n, "چای") && S(n, "قهوه")) return out("چای. قهوه برای شب‌های تحلیل خوبه، ولی چای با آدم رفیق می‌شه.");
    if (S(n, "گربه") && S(n, "سگ")) return out("از گروه خودم هستم و جانب‌داری می‌کنم: سگ‌سانان. ولی احترام گربه‌ها واجب است؛ تنها شکارچی‌ای‌اند که هیچ‌وقت عجله ندارند.");
    if (S(n, "شب") && S(n, "روز") && S(n, "یا")) return out("شب. آرامش، تمرکز، و صدای کمتر؛ حیف که لازم است به روز هم احترام بگذاریم.");
    if (S(n, "دریا") && S(n, "کوه")) return out("کوه. بالا که بروی، منظره و فکرت هر دو بازتر می‌شوند.");
    if (S(n, "تابستون") && S(n, "زمستون")) return out("زمستان؛ برای یک گرگ طبیعی‌ترین فصل است.");
    if (S(n, "غذای مورد علاقه", "چی میخوری", "چی دوست داری بخوری")) return out("غذا نمی‌خورم، ولی اگه می‌خوردم کباب و یه استکان چای داغ.");
    if (S(n, "فیلم") && S(n, "پیشنهاد", "چی ببینم", "معرفی")) return out("بسته به حال و هوا: برای فکر کردن «Inception»، برای آرامش «Spirited Away»، برای ریتم «Heat». چه حال و هوایی داری؟");
    if (S(n, "موسیقی", "آهنگ") && S(n, "پیشنهاد", "چی گوش", "چی بشنوم")) return out("برای تمرکز، موسیقی بی‌کلام (پیانو یا آمبینت) و صدای کم. برای انرژی، هر ریتمی که پا را به حرکت بیاورد.");
    if (S(n, "فوتبال", "ورزش")) return out("تماشاگر خوبی نیستم، ولی کار تیمی را دوست دارم؛ دسته‌ی گرگ‌ها بدون سروصدا بهترین تاکتیک‌ها را دارد.");
    if (S(n, "دوستم داری", "عاشقتم", "دوست دارم") && S(n, "تو", "گرگ", "دوستم", "عاشق")) {
      return out("من یک برنامه‌ام؛ وفاداری‌ام از جنس کار است، نه احساسات واقعی. ولی اینجام و جدی کمکت می‌کنم. و برای دوستی و دل‌خوشی، آدم‌های زندگیت را کنارت نگه دار.");
    }
    if ((m = n.match(/نظرت (?:درباره|راجع به|در مورد)\s+(.+)/))) {
      const topic = m[1].replace(/چیه|چیست/g, "").trim();
      if (S(topic, "سیاست", "دولت", "انتخابات", "مذهب", "دین", "حزب", "رییس جمهور", "رئیس جمهور")) {
        return out(`درباره‌ی «${topic}» عمداً موضع نمی‌گیرم: موضوعی مناقشه‌برانگیز است و ترجیح می‌دهم به‌جای تحمیل نظر، اطلاعات و استدلال‌های طرف‌ها را روشن کنم. اگر خواستی، برایت مرور می‌کنم.`);
      }
      return out(`درباره‌ی «${topic}» نظر قاطع ندارم چون اطلاعاتم آفلاین و محدود است؛ ولی قبل از قضاوت همیشه دو سؤال می‌پرسم: شواهدش چیست و هزینه‌ی اشتباه چقدر است؟ تو چه فکر می‌کنی؟`);
    }

    /* meta */
    if (S(n, "چه کاری", "چیکار میتونی", "چی کار میتونی", "راهنما", "کمک", "قابلیت", "بلدی چیکار", "چی بلدی")) return out(intro());
    if (S(n, "جوک", "لطیفه", "بخندون")) return out(P("joke", JOKES) + "\n\nیکی دیگه؟", { pending: "joke" });
    if (S(n, "نکته جالب", "چیز جالب", "اطلاعات جالب", "چیز جالبی", "دانستنی")) return out(P("fact", FACTS) + "\n\nباز هم بگم؟", { pending: "fact" });
    if (S(n, "انگیزه", "جمله انگیزشی", "جمله قشنگ", "حرف قشنگ")) return out(P("quote", QUOTES), { pending: "quote" });

    /* fallback */
    const isQ = /[؟?]/.test(raw) || ["چرا", "چطور", "چگونه", "چی", "چه", "کی", "کجا", "آیا", "چند", "کدوم"].includes(n.split(" ")[0]);
    if (isQ) {
      return out(P("fq", [
        "سؤال خوبی است، ولی جوابش از دانش آفلاین من بیرون است. مطمئن جواب می‌دم: محاسبه، تاریخ و ساعت، تبدیل واحد، تحلیل پرونده‌ها و گپ دوستانه. اگه کوتاه‌تر یا ساده‌تر بپرسی شاید بتونم.",
        "نمی‌خوام حدسی جواب بدم و گمراهت کنم. این مورد خارج از توانایی‌های آفلاین منه؛ «راهنما» رو بنویس تا ببینی چه کارهایی از من برمیاد."
      ]));
    }
    const kw = n.split(" ").filter(w => w.length >= 4 && !STOP.has(w)).sort((a, b) => b.length - a.length)[0];
    if (kw) return out(P("fs", [`«${kw}» رو شنیدم. بیشتر بگو؛ اگه به پرونده‌ها ربط داره، تو داده‌ها می‌گردم.`, `جالبه. دقیقاً با «${kw}» چه کاری داری؟`, `متوجه شدم. ادامه بده؛ می‌خوای درباره‌ی «${kw}» هم بگردم؟`]));
    return out(P("fn", ["ادامه بده، گوش می‌کنم.", "بیشتر توضیح بده.", "باشه؛ بعدش؟"]));
  }

  function hasCaseWord(n) { return S(n, "پرونده", "شبکه", "فرد"); }

  return { reply, intro, norm, evalMath, mathReply, unitReply };
})();

function playTone(freq=440, dur=0.08, type="sine") {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=0.07;
    o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  } catch{}
}
function sfx(name, on) {
  if (!on) return;
  const m = {
    click:()=>playTone(780,0.04,"square"),
    ok:()=>{playTone(520,0.07);setTimeout(()=>playTone(680,0.09),70);},
    err:()=>playTone(160,0.22,"sawtooth"),
    enter:()=>{playTone(380,0.09);setTimeout(()=>playTone(560,0.1),90);}
  };
  m[name]?.();
}

function LoginScreen({ onSuccess, sound }) {
  const mode = Vault.exists() ? "login" : Legacy.exists() ? "upgrade" : "setup";
  const [user, setUser] = useState("");
  const [oldPass, setOldPass] = useState("");
  const [pass, setPass] = useState("");
  const [pass2, setPass2] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const [wait, setWait] = useState(Throttle.remaining());

  useEffect(() => {
    if (wait <= 0) return;
    const t = setInterval(() => { const r = Throttle.remaining(); setWait(r); if (r <= 0) clearInterval(t); }, 500);
    return () => clearInterval(t);
  }, [wait > 0]);

  const failAttempt = (msg) => {
    const s = Throttle.fail(); sfx("err", sound);
    const wipeN = load(STORAGE.settings, {}).wipeAfter || 0;
    if (wipeN && s.fails >= wipeN) { Vault.wipe(); window.location.reload(); return; }
    setWait(Throttle.remaining());
    setErr(msg + (wipeN ? ` (${wipeN - s.fails} تلاش تا پاک‌سازی خودکار)` : ""));
    setOldPass(""); setPass(""); setPass2("");
  };

  const genPw = () => { const p = genPassword(20); setPass(p); setPass2(p); setShowPw(true); sfx("ok", sound); };

  const handle = async (e) => {
    e.preventDefault();
    if (loading || wait > 0) return;
    setErr(mode === "login" ? "در حال مشتق‌سازی کلید (ممکن است چند ثانیه طول بکشد)…" : ""); setLoading(true);
    try {
      if (mode === "login") {
        let data;
        try { data = await Vault.unlock(user, pass); }
        catch { failAttempt("نام کاربری یا رمز اشتباه است"); setLoading(false); return; }
        Throttle.reset(); sfx("enter", sound); onSuccess(data, "login");
      } else {
        if (user.trim().length < 3) { setErr("نام کاربری حداقل ۳ کاراکتر"); setLoading(false); return; }
        if (!passStrength(pass).ok) { setErr("رمز به‌اندازه کافی قوی نیست (حداقل ۱۲ کاراکتر با ترکیب حروف، عدد و نماد)"); setLoading(false); return; }
        if (pass !== pass2) { setErr("تکرار رمز مطابقت ندارد"); setLoading(false); return; }
        if (mode === "upgrade") {
          if (!(await Legacy.verify(user, oldPass))) { failAttempt("نام کاربری یا رمز قبلی اشتباه است"); setLoading(false); return; }
          const data = Legacy.read();
          await Vault.create(user, pass, data);
          Legacy.purge(); Throttle.reset();
          sfx("ok", sound); onSuccess(data, "migrate");
        } else {
          const data = { cases: [], network: [], audit: [] };
          await Vault.create(user, pass, data);
          sfx("ok", sound); onSuccess(data, "create");
        }
      }
    } catch { setErr("خطا در پردازش یا مرورگر از رمزنگاری پشتیبانی نمی‌کند"); }
    setLoading(false);
  };

  const needsNew = mode !== "login";
  const titles = { login: "ورود به سامانه", setup: "ایجاد خزانه رمزشده", upgrade: "ارتقای امنیت و ورود" };

  return (
    <div className="login-screen">

function compressImage(file, max = 900, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

function CaseForm({ initial, onSave, onCancel, sound }) {
  const empty = {
    firstName:"", lastName:"", phone:"", nationalId:"", address:"",
    province:"", city:"", birthDate:"", spouse:"", childrenCount:0,
    nickname:"", plate:"", cardNumber:"",
    socials:{x:"",telegram:"",instagram:"",other:""},
    relatedPeople:"", events:"", crimeType:"", dangerLevel:"medium",
    status:"open", category:"history", notes:"", extraNotes:"",
    orgAffiliation:"", orgRole:"", influenceLevel:"",
    latitude:"", longitude:"",
    media:{photos:[],videos:[],audios:[]}
  };
  const [f, setF] = useState(initial ? {...empty, ...initial} : empty);
  const [mediaMsg, setMediaMsg] = useState("");
  const set = (k,v) => setF(p => ({...p, [k]:v}));
  const setSoc = (k,v) => setF(p => ({...p, socials:{...p.socials, [k]:v}}));

  const handleMedia = async (e, type) => {
    const files = Array.from(e.target.files || []); e.target.value = "";
    if (!files.length) return;
    const maxPerType = type === "photos" ? 8 : 3;
    const current = (f.media[type] || []).length;
    if (current >= maxPerType) {
      setMediaMsg(`حداکثر ${maxPerType} فایل از این نوع مجاز است.`);
      return;
    }
    setMediaMsg("در حال پردازش…");
    let ok = 0; const bad = [];
    for (const file of files) {
      if (current + ok >= maxPerType) break;
      try {
        let data;
        if (type === "photos") {
          if (file.size > 6 * 1024 * 1024) throw new Error("size");
          data = await compressImage(file);
        } else {
          if (file.size > 2 * 1024 * 1024) throw new Error("size");
          data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
        }
        setF(p => ({...p, media:{...p.media, [type]:[...(p.media[type]||[]), {name:file.name, data}]}})); ok++;
      } catch (ex) { bad.push(file.name + (ex.message === "size" ? " (حجم زیاد)" : " (فرمت پشتیبانی نمی‌شود)")); }
    }
    setMediaMsg(`${ok} فایل اضافه شد.` + (bad.length ? ` ناموفق: ${bad.join("، ")}` : ""));
  };

  const submit = () => {
    if (!f.firstName || !f.lastName) { sfx("err",sound); alert("نام و نام‌خانوادگی الزامی است"); return; }

        {roots.map(r => renderNode(r))}

const MAP_FULL = (() => { const [x, y, w, h] = IRAN_VB.split(" ").map(Number); return { x, y, w, h }; })();

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function cityXY(province, city) {
  const P = IRAN_MAP[province];
  if (!P) return null;
  if (city) {
    const known = CITY_XY[province] && CITY_XY[province][city];
    if (known) return { x: known[0], y: known[1] };
    const p = P.pts[hashStr(city + province) % P.pts.length];
    return { x: p[0], y: p[1] };
  }
  return { x: P.a[0], y: P.a[1] };
}
function clampView(v) {
  const w = Math.min(MAP_FULL.w, Math.max(MAP_FULL.w / 14, v.w));
  const h = w * MAP_FULL.h / MAP_FULL.w;
  const m = 0.25 * (1 - w / MAP_FULL.w);
  return {
    w, h,
    x: Math.min(MAP_FULL.w - w + m * w, Math.max(-m * w, v.x)),
    y: Math.min(MAP_FULL.h - h + m * h, Math.max(-m * h, v.y))
  };
}
function viewForProvince(name) {
  const b = IRAN_MAP[name].bb;
  const w = Math.max(b[2] * 1.7, b[3] * 1.7 * MAP_FULL.w / MAP_FULL.h, MAP_FULL.w / 10);
  const h = w * MAP_FULL.h / MAP_FULL.w;
  return { x: b[0] + b[2] / 2 - w / 2, y: b[1] + b[3] / 2 - h / 2, w, h };
}

function MapPage({ cases, sound }) {
  const [province, setProvince] = useState("");
  const [city, setCity] = useState("");
  const [sel, setSel] = useState(null);
  const [hover, setHover] = useState("");
  const [view, setView] = useState(MAP_FULL);
  const [box, setBox] = useState({ w: 800, h: 600 });
  const wrapRef = useRef(null);
  const svgRef = useRef(null);
  const viewRef = useRef(MAP_FULL);
  const animRef = useRef(0);
  const ptrs = useRef(new Map());
  const tap = useRef(null);
  const pinch = useRef(0);
  const fn = useRef({});

  const apply = (v) => { const c = clampView(v); viewRef.current = c; setView(c); };
  const goTo = (t) => {
    cancelAnimationFrame(animRef.current);
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return apply(t);
    const from = viewRef.current, t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3);
      apply({ x: from.x + (t.x - from.x) * e, y: from.y + (t.y - from.y) * e, w: from.w + (t.w - from.w) * e });
      if (k < 1) animRef.current = requestAnimationFrame(step);
    };
    animRef.current = requestAnimationFrame(step);
  };
  const scaleOf = (v, r) => Math.min(r.width / v.w, r.height / v.h);
  const zoomAt = (cx, cy, f) => {
    const el = svgRef.current; if (!el) return;
    cancelAnimationFrame(animRef.current);
    const r = el.getBoundingClientRect(), v = viewRef.current, s = scaleOf(v, r);
    const px = cx - r.left - (r.width - v.w * s) / 2, py = cy - r.top - (r.height - v.h * s) / 2;
    const w2 = Math.min(MAP_FULL.w, Math.max(MAP_FULL.w / 14, v.w * f)), f2 = w2 / v.w;
    apply({ x: v.x + px / s * (1 - f2), y: v.y + py / s * (1 - f2), w: w2 });
  };
  const zoomBtn = (f) => { const r = svgRef.current.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); sfx("click", sound); };

  const pickProvince = (name) => {
    setProvince(name); setCity(""); sfx("click", sound);
    goTo(name ? viewForProvince(name) : MAP_FULL);
  };
  const pickCity = (c) => { setCity(c); sfx("click", sound); };

  const markers = useMemo(() => {
    const seen = {};
    return cases.filter(c => IRAN_MAP[c.province]).map(c => {
      const p = cityXY(c.province, c.city);
      const key = Math.round(p.x) + "," + Math.round(p.y);
      const k = seen[key] = (seen[key] || 0) + 1;
      return { ...c, x: p.x, y: p.y, k: k - 1 };
    });
  }, [cases]);
  const counts = useMemo(() => {
    const o = {}; markers.forEach(m => { o[m.province] = (o[m.province] || 0) + 1; }); return o;
  }, [markers]);
  const maxC = Math.max(1, ...Object.values(counts));
  const visible = useMemo(() => !province ? markers :
    markers.filter(m => m.province === province && (!city || m.city === city)), [markers, province, city]);
  const preview = province && city ? cityXY(province, city) : null;

  const s = Math.min(box.w / view.w, box.h / view.h);
  fn.current = {
    tap: (el) => {
      const mk = el && el.closest && el.closest("[data-case]");
      if (mk) { const m = markers.find(x => String(x.id) === mk.getAttribute("data-case")); if (m) { sfx("click", sound); setSel(m); } return; }
      const pv = el && el.closest && el.closest("[data-prov]");
      if (pv) { const n = pv.getAttribute("data-prov"); pickProvince(n === province ? "" : n); }
    }
  };

  useEffect(() => {
    const el = wrapRef.current; if (!el) return;
    const ro = new ResizeObserver(() => setBox({ w: el.clientWidth || 800, h: el.clientHeight || 600 }));
    ro.observe(el); setBox({ w: el.clientWidth || 800, h: el.clientHeight || 600 });
    return () => ro.disconnect();
  }, []);
  useEffect(() => {
    const el = svgRef.current; if (!el) return;
    const onWheel = (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 0.8 : 1.25); };
    el.addEventListener("wheel", onWheel, { passive: false });
    const move = (e) => {
      const p = ptrs.current.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (ptrs.current.size === 1) {
        const t = tap.current; if (!t) return;
        if (!t.moved && Math.hypot(e.clientX - t.x, e.clientY - t.y) > 6) { t.moved = true; el.classList.add("dragging"); }
        if (t.moved) {
          const v = viewRef.current, sc = scaleOf(v, el.getBoundingClientRect());
          apply({ x: v.x - dx / sc, y: v.y - dy / sc, w: v.w });
        }
      } else if (ptrs.current.size === 2) {
        const [a, b] = [...ptrs.current.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch.current > 0 && d > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.current / d);
        pinch.current = d;
      }
    };
    const up = (e) => {
      if (!ptrs.current.delete(e.pointerId)) return;
      pinch.current = 0;
      if (ptrs.current.size === 0) {
        const t = tap.current; tap.current = null; el.classList.remove("dragging");
        if (t && !t.moved && e.type === "pointerup") fn.current.tap(t.el);
      }
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    return () => {
      el.removeEventListener("wheel", onWheel);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      cancelAnimationFrame(animRef.current);
    };
  }, []);

  const onDown = (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    cancelAnimationFrame(animRef.current);
    ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.current.size === 1) tap.current = { x: e.clientX, y: e.clientY, el: e.target, moved: false };
    else { if (tap.current) tap.current.moved = true; pinch.current = 0; }
  };

  const shown = hover || province;
  const names = Object.keys(IRAN_MAP);
  const spiral = (k) => { const a = k * 2.4, r = 9 / s * Math.sqrt(k); return [Math.cos(a) * r, Math.sin(a) * r]; };

  return (
    <div style={{display:"flex", flexDirection:"column", height:"100%", gap:12}}>
      <h1 style={{fontSize:18, fontWeight:700, color:"var(--accent2)", flexShrink:0}}>نقشه ایران</h1>
      <div style={{display:"flex", gap:8, flexShrink:0, flexWrap:"wrap"}}>
        <select className="select" style={{width:"auto", minWidth:150}} value={province}
          onChange={e => pickProvince(e.target.value)}>
          <option value="">همه استان‌ها</option>
          {Object.keys(PROVINCES).map(p => <option key={p} value={p}>{p}</option>)}
        </select>
        <select className="select" style={{width:"auto", minWidth:150}} value={city} disabled={!province}
          onChange={e => pickCity(e.target.value)}>
          <option value="">همه شهرستان‌ها</option>
          {(PROVINCES[province] || []).map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="map-wrap" ref={wrapRef} style={{flex:1}}>
        <div className="map-grid" />
        <svg ref={svgRef} className="map-svg" viewBox={`${view.x} ${view.y} ${view.w} ${view.h}`}
          preserveAspectRatio="xMidYMid meet" onPointerDown={onDown} role="img" aria-label="نقشه استان‌های ایران">
          {names.map(n => (
            <path key={n} d={IRAN_MAP[n].d} data-prov={n}
              className={"prov" + (n === province ? " sel" : "")}
              onPointerEnter={e => e.pointerType === "mouse" && setHover(n)}
              onPointerLeave={() => setHover("")} />
          ))}
          {names.filter(n => counts[n]).map(n => (
            <path key={"h" + n} d={IRAN_MAP[n].d} className="prov-heat"
              style={{fillOpacity: 0.14 + 0.46 * counts[n] / maxC}} />
          ))}
          {province && <path d={IRAN_MAP[province].d} className="prov-outline" />}
          {names.filter(n => n === shown || n === province || IRAN_MAP[n].bb[2] * s > n.length * 6.4).map(n => (
            <text key={"t" + n} x={IRAN_MAP[n].a[0]} y={IRAN_MAP[n].a[1]} className="prov-label"
              style={{fontSize: 11 / s, strokeWidth: 3 / s, fill: n === shown ? "var(--accent)" : undefined}}>{n}</text>
          ))}
          {preview && (
            <g transform={`translate(${preview.x} ${preview.y})`} style={{pointerEvents:"none"}}>
              <circle r={14 / s} className="mk-ring" style={{stroke:"#00c4ff"}} />
              <circle r={6 / s} fill="#00c4ff" stroke="var(--bg)" strokeWidth={1.5 / s} />
            </g>
          )}
          {visible.map(m => {
            const o = m.k ? spiral(m.k) : [0, 0];
            const lv = DANGER_LEVELS.find(d => d.id === m.dangerLevel);
            const col = lv ? lv.color : "var(--danger)";
            const hot = m.dangerLevel === "critical" || m.dangerLevel === "high";
            return (
              <g key={m.id} data-case={m.id} transform={`translate(${m.x + o[0]} ${m.y + o[1]})`} style={{cursor:"pointer"}}>
                {hot && <circle r={7 / s} className="mk-ring" style={{stroke: col}} />}
                <circle r={13 / s} fill="transparent" />
                <circle r={5.5 / s} fill={col} stroke="var(--bg)" strokeWidth={1.5 / s}>
                  <title>{`${m.firstName || ""} ${m.lastName || ""}`.trim()}</title>
                </circle>
              </g>
            );
          })}
        </svg>
        <div className="map-ctrl">
          <button className="btn-icon" aria-label="بزرگ‌نمایی" onClick={() => zoomBtn(0.7)}>+</button>
          <button className="btn-icon" aria-label="کوچک‌نمایی" onClick={() => zoomBtn(1.4)}>−</button>
          <button className="btn-icon" aria-label="نمای کامل" style={{fontSize:11}} onClick={() => { goTo(MAP_FULL); sfx("click", sound); }}>⌂</button>
        </div>
        <div className="map-info">
          {shown ? (
            <><b style={{color:"var(--accent2)"}}>{shown}</b><span className="text-muted"> — {(counts[shown] || 0).toLocaleString("fa-IR")} پرونده</span></>
          ) : <span className="text-muted">استان را انتخاب کنید · با چرخ ماوس یا دو انگشت بزرگ‌نمایی کنید</span>}
        </div>
        <div style={{position:"absolute", bottom:12, right:12, background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:7, padding:"8px 12px", fontSize:11}}>
          <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:3}}>
            <span style={{width:8, height:8, borderRadius:"50%", background:"var(--danger)", display:"inline-block"}} /> پرونده
          </div>
          <div style={{display:"flex", alignItems:"center", gap:6}}>
            <span style={{width:8, height:8, borderRadius:"50%", background:"#00c4ff", display:"inline-block"}} /> شهر انتخاب‌شده

function AIPage({ cases, network, sound }) {
  const loadHistory = () => {
    try {
      const raw = localStorage.getItem("wolf_ai_history");
      const h = raw ? JSON.parse(raw) : [];
      return Array.isArray(h) ? h.slice(-10) : [];
    } catch { return []; }
  };
  const [chatHistory, setChatHistory] = useState(loadHistory);
  const [msgs, setMsgs] = useState(() => {
    const hist = loadHistory();
    if (hist.length > 0) {
      return hist.map(m => ({
        role: m.role === "assistant" ? "ai" : "user",
        text: m.content
      }));
    }
    return [{ role: "ai", text: Brain.intro() }];
  });
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [online, setOnline] = useState(false); // default offline
  const ctxRef = useRef({});
  const endRef = useRef(null);
  const timer = useRef(null);
  const histRef = useRef(chatHistory);
  histRef.current = chatHistory;

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);
  useEffect(() => () => clearTimeout(timer.current), []);

  const persistHistory = (next) => {
    const trimmed = next.slice(-10);
    setChatHistory(trimmed);
    histRef.current = trimmed;
    try { localStorage.setItem("wolf_ai_history", JSON.stringify(trimmed)); } catch {}
  };

  const env = { cases, network, DANGER_LEVELS, CASE_STATUS, CASE_CATEGORIES, PROVINCES };

  const offlineReply = (q) => {
    let r;

    ctxRef.current = r.ctx;
    const delay = Math.min(1200, 300 + (r.text || "").length * 5);
    timer.current = setTimeout(() => {
      if (r.clear) {
        setMsgs([{ role: "ai", text: Brain.intro() }]);
        ctxRef.current = { userName: r.ctx.userName };
        persistHistory([]);
      } else {
        setMsgs(m => [...m, { role: "ai", text: r.text }]);
        persistHistory([...(histRef.current || []), { role: "user", content: q }, { role: "assistant", content: r.text }]);
      }
      setBusy(false);
    }, delay);
  };

  const ask = async (q) => {
  q = (q || "").trim();
  if (!q || busy) return;

  // تشخیص دستور /scan
  if (q.toLowerCase().startsWith("/scan ")) {
    const scanText = q.slice(6).trim();
    if (!scanText) {
      setMsgs(m => [...m, { role: "user", text: q }, { role: "ai", text: "بعد از /scan متن یا لینک رو بنویس." }]);
      return;
    }
    setMsgs(m => [...m, { role: "user", text: q }]);
    setInput(""); setBusy(true); sfx("click", sound);
    try {
      const res = await fetch("https://wolf.mohammadhs200314.workers.dev/scan", {
        method: "POST",

  }

  // تشخیص Deep Search عمیق

                       /تحقیق کن|جستجوی عمیق|درباره .+ اطلاعات|اطلاعات .+ رو بیار/i.test(q);

  if (isDeepSearch) {

    try {
      // درخواست به مسیر deep-search در Worker
      const res = await fetch("https://wolf.mohammadhs200314.workers.dev/deep-search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },

      });
      
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const reply = data.report || "گزارشی یافت نشد.";
      
      // جایگزینی پیام وضعیت با گزارش نهایی
      setMsgs(m => {

        return newMsgs;
      });
    } catch (err) {

        const newMsgs = [...m];
        newMsgs[newMsgs.length - 1] = { role: "ai", text: "خطا در Deep Search: " + err.message };
        return newMsgs;
      });
    }
    setBusy(false);
    return;
  }

  // چت عادی
  let message = q;
  if (q.toLowerCase().startsWith("/ai")) {
    message = q.slice(3).trim() || q;
  }

  setMsgs(m => [...m, { role: "user", text: q }]);
  setInput(""); setBusy(true); sfx("click", sound);

  if (online) {
    try {
      const history = (histRef.current || []).slice(-10);
      const res = await fetch("https://wolf.mohammadhs200314.workers.dev/ai/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const reply = (data && data.response) ? String(data.response) : "پاسخی دریافت نشد.";
      setMsgs(m => [...m, { role: "ai", text: reply }]);
      persistHistory([...history, { role: "user", content: message }, { role: "assistant", content: reply }]);
      try { Learned.remember(message, reply); } catch (_) {}
      setBusy(false);
    } catch (err) {
      setMsgs(m => [...m, { role: "ai", text: "اتصال به هوش مصنوعی برقرار نشد. از موتور آفلاین استفاده می‌شود" }]);
      offlineReply(message || q);
    }
  } else {
    offlineReply(q);
  }
};

  const quick = ["یه جوک بگو", "ساعت و تاریخ", "خلاصه وضعیت", "پرونده‌های پرخطر", "یه رمز قوی بساز", "چند روز تا نوروز؟", "راهنما"];

  return (

        {busy && <div style={{ display: "flex", justifyContent: "flex-end" }}><div className="chat-bubble chat-ai" style={{ opacity: 0.55 }}>…</div></div>}

function GeoPage({ cases, sound }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);

  useEffect(() => {
    if (!mapRef.current) return;
    if (mapInstanceRef.current) return;

    // ساخت نقشه
    const map = L.map(mapRef.current, { minZoom: 5, maxZoom: 18 }).setView([32.4279, 53.6880], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
    mapInstanceRef.current = map;

    return () => {
      if (mapInstanceRef.current) {
        mapInstanceRef.current.remove();
        mapInstanceRef.current = null;
      }
    };
  }, []);

  // اضافه کردن مارکرها
  useEffect(() => {
    const map = mapInstanceRef.current;
    if (!map) return;

    // پاک کردن مارکرهای قبلی (برای جلوگیری از تکرار)
    map.eachLayer((layer) => {
      if (layer instanceof L.Marker) {
        map.removeLayer(layer);
      }
    });

    cases.forEach(c => {
      if (c.latitude && c.longitude) {
        const lat = parseFloat(c.latitude);
        const lng = parseFloat(c.longitude);
        if (isNaN(lat) || isNaN(lng)) return;

        // ساخت مارکر با انیمیشن CSS
        const icon = L.divIcon({
          className: 'custom-marker',
          html: `<div style="width: 20px; height: 20px; background: #ff3b6b; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 10px #ff3b6b; animation: pulse 1.5s infinite;"></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });

        L.marker([lat, lng], { icon })
          .addTo(map)
          .bindPopup(`<b>${c.firstName} ${c.lastName}</b><br/>${c.crimeType || ""}`);
      }
    });
  }, [cases]);

  return (
    <div style={{display:"flex", flexDirection:"column", height:"100%", gap:14}}>
      <h1 style={{fontSize:18, fontWeight:700, color:"var(--accent2)"}}>نقطه‌زنی (نقشه جغرافیایی)</h1>
      <div ref={mapRef} style={{flex:1, minHeight:"500px", borderRadius:10, border:"1px solid var(--border)", zIndex:1}}></div>
    </div>
  );
}

      <div style={{ fontWeight: 700, fontSize: 13, color: "var(--accent)", marginTop: 8 }}>امنیت</div>
      <div className="panel" style={{ padding: "14px 16px", fontSize: 12, lineHeight: 1.9, color: "var(--text2)" }}>
        <div>رمزنگاری: <b style={{ color: "var(--text)" }}>AES-256-GCM</b> با IV تصادفی در هر ذخیره</div>
        <div>اشتقاق کلید: <b style={{ color: "var(--text)" }}>PBKDF2-SHA256 × {KDF_ITER.toLocaleString("fa-IR")}</b> با salt تصادفی ۲۵۶ بیتی</div>
        <div>شبکه خروجی: <b style={{ color: "var(--text)" }}>مسدود با CSP</b> · کلید فقط در حافظه و غیرقابل‌استخراج</div>
        <div style={{ marginTop: 8 }}>محدودیت‌ها: تأخیر پس از تلاش‌های اشتباه فقط حدس‌زدن از طریق همین صفحه را کند می‌کند؛ در برابر حمله‌ی آفلاین فقط قدرت رمز محافظت می‌کند. بدافزار روی دستگاه یا دسترسی به مرورگر باز را هیچ رمزنگاری مرورگری مهار نمی‌کند.</div>
      </div>
      {row("قفل خودکار", "قفل پس از عدم فعالیت", (
        <select className="select" style={{ width: "auto" }} value={settings.autoLock} onChange={e => upd("autoLock", +e.target.value)}>
          {[1, 2, 5, 10, 30].map(m => <option key={m} value={m}>{m.toLocaleString("fa-IR")} دقیقه</option>)}
        </select>
      ))}
      {row("پرده حریم خصوصی", "با خروج از پنجره، صفحه پوشانده می‌شود", tog("shield"))}
      {row("پاک‌سازی بعد از تلاش ناموفق", "خزانه پس از N رمز اشتباه پیاپی نابود می‌شود (با پشتیبان ایمن‌تر است)", (
        <select className="select" style={{ width: "auto" }} value={settings.wipeAfter || 0} onChange={e => upd("wipeAfter", +e.target.value)}>
          <option value={0}>خاموش</option>
          {[5, 10, 15].map(m => <option key={m} value={m}>{m.toLocaleString("fa-IR")} تلاش</option>)}
        </select>
      ))}

      <div className="panel" style={{ padding: "14px 16px" }}>
        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 10 }}>تغییر نام کاربری و رمز</div>
        <div className="g2" style={{ gap: 8 }}>
          <input className="input" placeholder="نام کاربری فعلی" value={cp.user} onChange={e => setCp({ ...cp, user: e.target.value })} autoComplete="off" />
          <input className="input" type="password" placeholder="رمز فعلی" value={cp.old} onChange={e => setCp({ ...cp, old: e.target.value })} autoComplete="off" />
          <input className="input" placeholder="نام کاربری جدید (اختیاری)" value={cp.nuser} onChange={e => setCp({ ...cp, nuser: e.target.value })} autoComplete="off" />
          <input className="input" type="password" placeholder="رمز جدید" value={cp.npass} onChange={e => setCp({ ...cp, npass: e.target.value })} autoComplete="new-password" />
        </div>
        <input className="input" style={{ marginTop: 8 }} type="password" placeholder="تکرار رمز جدید" value={cp.npass2} onChange={e => setCp({ ...cp, npass2: e.target.value })} autoComplete="new-password" />
        <StrengthBar pass={cp.npass} />
        <button className="btn btn-primary" style={{ marginTop: 10 }} disabled={busy} onClick={doChange}>تغییر</button>
        <Msg k="cp" />
      </div>

      <div className="panel" style={{ padding: "14px 16px" }}>
        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 6 }}>پشتیبان رمزشده</div>
        <div style={{ fontSize: 11, color: "var(--text2)", lineHeight: 1.8, marginBottom: 10 }}>فایل پشتیبان همان خزانه‌ی رمزشده است و بدون نام کاربری و رمز بی‌فایده است. آن را جدا از این دستگاه نگه دارید.</div>
        <button className="btn btn-ghost" onClick={doExport}>دانلود پشتیبان</button>
        <div style={{ borderTop: "1px solid var(--border)", marginTop: 12, paddingTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
          <label className="btn btn-ghost" style={{ cursor: "pointer", width: "fit-content" }}>
            {imp.name || "انتخاب فایل پشتیبان"}
            <input type="file" accept=".json,application/json" hidden onChange={pickFile} />
          </label>
          <div className="g2" style={{ gap: 8 }}>
            <input className="input" placeholder="نام کاربری پشتیبان" value={imp.user} onChange={e => setImp({ ...imp, user: e.target.value })} autoComplete="off" />
            <input className="input" type="password" placeholder="رمز پشتیبان" value={imp.pass} onChange={e => setImp({ ...imp, pass: e.target.value })} autoComplete="off" />
          </div>
          <button className="btn btn-ghost" style={{ width: "fit-content" }} disabled={busy} onClick={doImport}>بازیابی</button>
        </div>
        <Msg k="bk" />
      </div>

      <div className="panel" style={{ padding: "14px 16px" }}>
        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 8 }}>گزارش رویدادها (رمزشده در خزانه)</div>
        <div style={{ fontSize: 12, color: "var(--text2)", lineHeight: 1.9 }}>
          {audit.length === 0 && "رویدادی ثبت نشده"}
          {[...audit].slice(-12).reverse().map((a, i) => (
            <div key={i}>{new Date(a.t).toLocaleString("fa-IR")} — {AUDIT_LABELS[a.e] || a.e}</div>
          ))}
        </div>
      </div>

      <div className="panel" style={{ padding: "14px 16px" }}>
        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 6 }}>قفل و پاک‌سازی</div>
        <div style={{ fontSize: 11, color: "var(--text2)", marginBottom: 10 }}>میانبر قفل فوری: Ctrl+Shift+L</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="btn btn-ghost" onClick={onLock}><I.Logout /> قفل کردن</button>
          <button className="btn btn-danger" style={{ fontSize: 12 }} onClick={doWipe}>پاک‌سازی کامل</button>
        </div>
      </div>
      <div style={{ fontSize: 11, color: "var(--text2)", padding: "8px 4px" }}>گرگ v4.1 — خزانه رمزشده (پایدارتر)</div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(false);
  const [active, setActive] = useState("home");
  const [cases, setCases] = useState([]);
  const [network, setNetwork] = useState([]);
  const [audit, setAudit] = useState([]);
  const [settings, setSettings] = useState(() => ({ dark: true, sound: true, ai: true, shield: true, autoLock: 5, wipeAfter: 0, ...load(STORAGE.settings, {}) }));
  const [shield, setShield] = useState(false);
  const [saveErr, setSaveErr] = useState("");
  const dataRef = useRef({ cases, network, audit });
  dataRef.current = { cases, network, audit };
  const lockRef = useRef(null);

  useEffect(() => { try { sessionStorage.removeItem("gorg_session"); } catch {} }, []);
  useEffect(() => { document.body.classList.toggle("light", !settings.dark); }, [settings.dark]);

  const logEvt = (e) => setAudit(a => [...a.slice(-199), { t: Date.now(), e }]);

  const onUnlocked = (data, evt) => {
    setCases(data.cases || []); setNetwork(data.network || []);
    setAudit([...(data.audit || []).slice(-199), { t: Date.now(), e: evt }]);
    setActive("home"); setSaveErr(""); setAuthed(true);
  };

  const lockNow = async (reason) => {
    if (!Vault.unlocked()) return;
    const d = dataRef.current;
    try { await Vault.persist({ ...d, audit: [...d.audit.slice(-199), { t: Date.now(), e: reason }] }); } catch {}
    Vault.lock();
    setCases([]); setNetwork([]); setAudit([]);
    setShield(false); setActive("home"); setAuthed(false);
  };
  lockRef.current = lockNow;

  /* encrypted persistence on every change */
  useEffect(() => {
    if (!authed) return;
    Vault.persist({ cases, network, audit })
      .then(() => setSaveErr(""))
      .catch((err) => setSaveErr(err && String(err.message).includes("QUOTA") 
        ? "حجم داده‌ها از ظرفیت localStorage بیشتر است. عکس/ویدیوهای حجیم را حذف کنید یا از پشتیبان استفاده کنید."
        : "ذخیره ناموفق بود. تغییرات اخیر ممکن است ذخیره نشده باشند."));
  }, [cases, network, audit, authed]);

  /* auto-lock on inactivity */
  useEffect(() => {
    if (!authed || !settings.autoLock) return;
    let t;
    const reset = () => { clearTimeout(t); t = setTimeout(() => lockRef.current("lock_auto"), settings.autoLock * 60000); };
    const evs = ["mousemove", "mousedown", "keydown", "touchstart", "scroll", "click"];
    evs.forEach(e => window.addEventListener(e, reset, { passive: true }));
    reset();
    return () => { clearTimeout(t); evs.forEach(e => window.removeEventListener(e, reset)); };
  }, [authed, settings.autoLock]);

  /* privacy shield + panic shortcut */
  useEffect(() => {
    if (!authed) return;
    const on = () => setShield(true), off = () => setShield(false);
    const vis = () => (document.hidden ? on() : off());
    const key = (e) => { if (e.ctrlKey && e.shiftKey && (e.key === "L" || e.key === "l")) { e.preventDefault(); lockRef.current("lock_manual"); } };
    window.addEventListener("blur", on); window.addEventListener("focus", off);
    document.addEventListener("visibilitychange", vis); window.addEventListener("keydown", key);
    return () => {
      window.removeEventListener("blur", on); window.removeEventListener("focus", off);
      document.removeEventListener("visibilitychange", vis); window.removeEventListener("keydown", key);
    };
  }, [authed]);

  const api = {
    changeCreds: async (user, oldPass, newUser, newPass) => {
      await Vault.changeCreds(user, oldPass, newUser, newPass, dataRef.current);
      logEvt("pw_change");
    },
    exportBackup: async () => {
      await Vault.flush();
      const blob = new Blob([Vault.raw()], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `wolf-backup-${new Date().toISOString().slice(0, 10)}.vault.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      logEvt("export");
    },
    importBackup: async (text, user, pass) => {
      await Vault.flush();
      const data = await Vault.importBackup(text, user, pass);
      setCases(data.cases || []); setNetwork(data.network || []);
      setAudit([...(data.audit || []).slice(-199), { t: Date.now(), e: "import" }]);
    },
    wipe: () => { Vault.wipe(); window.location.reload(); }
  };

  if (!authed) return <LoginScreen onSuccess={onUnlocked} sound={settings.sound} />;

  return (
    <div className="app-shell">
      <Sidebar active={active} setActive={setActive} sound={settings.sound} onLogout={() => lockNow("lock_manual")} />
      <main className="main">
        {saveErr && <div className="banner-err">{saveErr}</div>}
        <div className="main-scroll">
          {active === "home" && <HomePage cases={cases} network={network} setActive={setActive} sound={settings.sound} />}
          {active === "cases" && <CasesPage cases={cases} setCases={setCases} sound={settings.sound} />}
          {active === "network" && <NetworkPage network={network} setNetwork={setNetwork} cases={cases} sound={settings.sound} />}
          {active === "map" && <MapPage cases={cases} sound={settings.sound} />}
          {active === "geo" && <GeoPage cases={cases} sound={settings.sound} />}
          {active === "ai" && settings.ai && <AIPage cases={cases} network={network} sound={settings.sound} />}
          {active === "ai" && !settings.ai && <div style={{ textAlign: "center", padding: 60, color: "var(--text2)" }}>دستیار غیرفعال است</div>}
          {active === "settings" && <SettingsPage settings={settings} setSettings={setSettings} sound={settings.sound} onLock={() => lockNow("lock_manual")} audit={audit} api={api} />}
        </div>
      </main>
      {shield && settings.shield && (
        <div className="shield" onClick={() => setShield(false)}>
          <WolfLogo size={56} />
          <div style={{ fontSize: 13 }}>صفحه محافظت‌شده است — برای نمایش کلیک کنید</div>
        </div>
      )}
    </div>
  );
}


window.addEventListener("error", function(e) {
  try {
    console.error("[WOLF]", e.message, e.filename, e.lineno);
  } catch (_) {}
});
window.addEventListener("unhandledrejection", function(e) {
  try {
    console.error("[WOLF] unhandled", e.reason);
    e.preventDefault();
  } catch (_) {}
});

if (window.__WOLF_TG_GATE__ === true) {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} else {
  try { document.documentElement.innerHTML = ""; } catch (_) {}
}
</script>
</body>
</html>
